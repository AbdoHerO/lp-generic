; lp_tifaw — production PHP settings.
; Loaded as conf.d/zz-*.ini so it wins over anything the base image sets.

expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
; Docker collects stderr, so this is what `docker compose logs app` shows.
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

; admin_upload_image() accepts files up to 5 MB. PHP's 2 MB default would push
; every larger upload into the silent `goto try_url` fallback, which looks to
; the admin like the file simply did not save.
; The CloudForge-managed Nginx site needs a matching client_max_body_size.
upload_max_filesize = 8M
post_max_size = 12M
max_file_uploads = 30

memory_limit = 256M
max_execution_time = 60

; The application calls date_default_timezone_set() from its own config, so
; this only covers the window before that runs.
date.timezone = UTC

; A named volume, so an admin is not logged out by every deploy.
session.save_path = "/var/lib/php/sessions"
session.gc_maxlifetime = 86400
session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.interned_strings_buffer = 16
; Each deploy is a new image, so the file timestamps can never change under a
; running container. Checking them would be pure syscall overhead.
opcache.validate_timestamps = 0
