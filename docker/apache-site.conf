# lp_tifaw — production vhost.
#
# The container listens on plain HTTP only. TLS terminates at Cloudflare and at
# the CloudForge-managed Nginx site in front of it; this port is published on
# 127.0.0.1 and is not reachable from the internet.

ServerTokens Prod
ServerSignature Off

# Nginx is the only thing that talks to this container, and it is reached over
# the compose bridge network. Without this every leads.ip row records the proxy
# rather than the visitor.
RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 127.0.0.1
RemoteIPTrustedProxy 10.0.0.0/8
RemoteIPTrustedProxy 172.16.0.0/12
RemoteIPTrustedProxy 192.168.0.0/16

<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        # The application ships its own .htaccess with the front-controller
        # rewrite; without AllowOverride All every URL except / returns 404.
        AllowOverride All
        Require all granted
    </Directory>

    # Defence in depth. The shipped .htaccess already blocks these, but a
    # future AllowOverride change should not silently expose config/config.prod.php.
    <DirectoryMatch "^/var/www/html/(config|src|sql|bin|tests|docker|storage)(/|$)">
        Require all denied
    </DirectoryMatch>

    # Second lock on doors .dockerignore and .htaccess already close. Markdown
    # is listed because documentation in the web root is served verbatim: it
    # describes the architecture, the admin surface and the security model.
    <FilesMatch "^(_diag\.php|\.env.*|Dockerfile|docker-compose\.ya?ml|Jenkinsfile)$">
        Require all denied
    </FilesMatch>
    <FilesMatch "\.(md|sql|sh|dist|example)$">
        Require all denied
    </FilesMatch>

    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    ErrorLog /dev/stderr
    # Excludes the healthcheck so `docker compose logs` is not 90% health polls.
    SetEnvIf Request_URI "^/health\.php$" cf_health
    CustomLog /dev/stdout combined env=!cf_health
</VirtualHost>
